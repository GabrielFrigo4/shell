    openbsd:
        name: 🐡 OpenBSD (7.x) Matrix
        needs: lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Test in OpenBSD Shell (zsh, bash, ksh)
              uses: vmactions/openbsd-vm@v1
              with:
                  usesh: true
                  run: |
                      ### ================================
                      ### OPENBSD ENVIRONMENT
                      ### ================================
                      uname -a
                      . ./library/detect.sh
                      OS=$(_detect_os)
                      echo "Detected OS: ${OS}"
                      [ "${OS}" = "openbsd" ] || { echo "Expected openbsd, got ${OS}"; exit 1; }

                      ### --------------------------------
                      ### Dependencies
                      ### --------------------------------
                      pkg_add -I zsh bash python3

                      ### --------------------------------
                      ### OpenBSD Target Prompts
                      ### --------------------------------
                      zsh -n target/openbsd/zsh/prompt.sh
                      zsh -n theme/zsh.sh
                      bash -n target/openbsd/bash/prompt.sh
