name: Universal Shell CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    lint:
        name: 🔍 Lint & Syntax Validation
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Install Shell Interpreters
              run: |
                  sudo apt-get update
                  sudo apt-get install -y zsh fish

            - name: Whitespace & Formatting Check (git diff --check)
              run: |
                  ### --------------------------------
                  ### WHITESPACE & FORMATTING
                  ### --------------------------------
                  git diff --check HEAD~1..HEAD 2> "/dev/null" || git diff --check

            - name: Git Index Permissions Audit (Regra 4a)
              run: |
                  ### --------------------------------
                  ### INDEX PERMISSIONS AUDIT
                  ### --------------------------------
                  python3 -c '
                  import os, subprocess, sys
                  out = subprocess.check_output(["git", "ls-files", "--stage"]).decode("utf-8", "replace")
                  errors = []
                  for row in out.splitlines():
                      if "\t" not in row:
                          continue
                      meta, path = row.split("\t", 1)
                      mode = meta.split()[0]
                      if mode == "120000":
                          continue
                      is_entry = False
                      if path.startswith(".githooks/") and os.path.isfile(path):
                          is_entry = True
                      elif path in ("shell.sh", "init.sh", "install.sh", "benchmark.sh"):
                          is_entry = True
                      elif path.startswith(".scripts/") and os.path.isfile(path):
                          with open(path, "rb") as fp:
                              is_entry = fp.read(2) == b"#!"
                      expected = "100755" if is_entry else "100644"
                      if mode != expected:
                          errors.append(f"{path}: {mode} != {expected}")
                  if not os.path.isfile(".scripts/emacs-client"):
                      errors.append(".scripts/emacs-client missing")
                  if errors:
                      print("❌ Regra 4a permission errors:", errors, file=sys.stderr)
                      sys.exit(1)
                  print("✅ Git Index permissions match Regra 4a.")
                  '

            - name: Bash Syntax Check (bash -n)
              run: |
                  ### --------------------------------
                  ### BASH & SHARED SHELL SYNTAX
                  ### --------------------------------
                  find . -name "*.sh" -not -path "./.git/*" -not -path "*/OSS/*" -not -path "*/zsh/*" -not -name "zsh.sh" -not -path "*/ksh/*" -not -name "ksh.sh" -exec bash -n {} +

            - name: Zsh Syntax Check (zsh -n)
              run: |
                  ### --------------------------------
                  ### ZSH SYNTAX
                  ### --------------------------------
                  find . -name "*.sh" -not -path "./.git/*" -not -path "*/OSS/*" -not -path "*/bash/*" -not -name "bash.sh" -not -path "*/ksh/*" -not -name "ksh.sh" -exec zsh -n {} +

            - name: POSIX Entrypoints Syntax Check (sh -n)
              run: |
                  ### --------------------------------
                  ### POSIX SH ENTRYPOINTS
                  ### --------------------------------
                  sh -n shell.sh init.sh install.sh benchmark.sh .scripts/emacs-client .githooks/pre-commit .githooks/commit-msg

            - name: Fish Syntax Check (fish -n)
              run: |
                  ### --------------------------------
                  ### FISH SYNTAX
                  ### --------------------------------
                  for _fish_file in target/common/fish/*.fish; do
                    [ -f "${_fish_file}" ] && fish -n "${_fish_file}" || exit 1
                  done

            - name: Quoting, Octals & Reference Audit
              run: |
                  ### --------------------------------
                  ### QUOTING & SECURITY RULES
                  ### --------------------------------
                  python3 -c '
                  import os, re, subprocess, sys
                  files = subprocess.check_output(["git", "ls-files"]).decode("utf-8", "replace").splitlines()
                  octal_needle = chr(92) + "033"
                  redir_rx = re.compile(r">\s*/dev/null")
                  bin_emacs_rx = re.compile(r"(?<!\.local/)bin/" + "emacs-client")
                  legacy_bsd_rx = re.compile("dragon" + "fly", re.IGNORECASE)
                  errors = []
                  for path in files:
                      if not os.path.isfile(path):
                          continue
                      if path.endswith(".sh") or path.startswith((".githooks/", ".scripts/")):
                          with open(path, "r", encoding="utf-8", newline="\n", errors="replace") as fp:
                              for line_no, line in enumerate(fp, 1):
                                  if redir_rx.search(line):
                                      errors.append(f"{path}:{line_no}: unquoted /dev/null redirect")
                      if path.endswith((".sh", ".py", ".fish", ".nu", ".lua")) or path == "Makefile" or path.startswith((".githooks/", ".scripts/", ".github/", ".agents/")):
                          with open(path, "r", encoding="utf-8", newline="\n", errors="replace") as fp:
                              content = fp.read()
                          if octal_needle in content:
                              errors.append(f"{path}: octal escape detected")
                          if bin_emacs_rx.search(content):
                              errors.append(f"{path}: legacy wrapper path")
                          if legacy_bsd_rx.search(content):
                              errors.append(f"{path}: legacy BSD reference")
                  if errors:
                      print("❌ Audit failures:", "\n".join(errors), sep="\n", file=sys.stderr)
                      sys.exit(1)
                  print("✅ All quoting, ANSI, and reference checks passed.")
                  '

    linux:
        name: 🐧 Linux (Ubuntu) Matrix
        needs: lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Install Shell Interpreters
              run: |
                  sudo apt-get update
                  sudo apt-get install -y zsh fish

            - name: Install Shell Environment (install.sh)
              run: |
                  ### --------------------------------
                  ### RUN UNIVERSAL SHELL INSTALLER
                  ### --------------------------------
                  ./install.sh --pure

            - name: Test in Linux Shell (Zsh, Bash & Fish)
              run: |
                  ### ================================
                  ### LINUX ENVIRONMENT
                  ### ================================
                  . ./library/detect.sh
                  OS=$(_detect_os)
                  echo "Detected OS: ${OS}"
                  [ "${OS}" = "linux" ] || { echo "Expected linux, got ${OS}"; exit 1; }

                  ### --------------------------------
                  ### LINUX TARGET PROMPTS
                  ### --------------------------------
                  zsh -n target/linux/zsh/prompt.sh
                  bash -n target/linux/bash/prompt.sh
                  for _fish_file in target/common/fish/*.fish; do
                    [ -f "${_fish_file}" ] && fish -n "${_fish_file}" || exit 1
                  done

                  ### --------------------------------
                  ### LINUX ZSH INTERACTIVE BOOT
                  ### --------------------------------
                  test -f "${HOME}/.zshrc" || { echo "Missing .zshrc"; exit 1; }
                  zsh -i -c 'echo "Linux Zsh boot with dotfiles OK: ${PROMPT}"'

                  ### --------------------------------
                  ### LINUX BASH INTERACTIVE BOOT
                  ### --------------------------------
                  test -f "${HOME}/.bashrc" || { echo "Missing .bashrc"; exit 1; }
                  bash -i -c 'echo "Linux Bash boot with dotfiles OK: ${PS1}"'

                  ### --------------------------------
                  ### LINUX FISH INTERACTIVE BOOT
                  ### --------------------------------
                  test -f "${XDG_CONFIG_HOME:-${HOME}/.config}/fish/config.fish" || { echo "Missing config.fish"; exit 1; }
                  fish -i -c 'echo "Linux Fish boot OK"'

                  ### --------------------------------
                  ### STARTUP LATENCY BENCHMARK
                  ### --------------------------------
                  ./benchmark.sh

    freebsd:
        name: 😈 FreeBSD (15.x) Matrix
        needs: lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Test in FreeBSD Shell (zsh, bash, sh)
              uses: vmactions/freebsd-vm@v1
              with:
                  release: "15"
                  usesh: true
                  envs: "CI GITHUB_ACTIONS"
                  run: |
                      ### ================================
                      ### FREEBSD ENVIRONMENT
                      ### ================================
                      freebsd-version || uname -a
                      . ./library/detect.sh
                      OS=$(_detect_os)
                      echo "Detected OS: ${OS}"
                      [ "${OS}" = "freebsd" ] || { echo "Expected freebsd, got ${OS}"; exit 1; }

                      ### --------------------------------
                      ### DEPENDENCIES
                      ### --------------------------------
                      pkg install -y zsh bash python3

                      ### --------------------------------
                      ### RUN UNIVERSAL SHELL INSTALLER
                      ### --------------------------------
                      ./install.sh --pure

                      ### --------------------------------
                      ### FREEBSD TARGET PROMPTS
                      ### --------------------------------
                      zsh -n target/freebsd/zsh/prompt.sh
                      zsh -n theme/zsh.sh
                      bash -n target/freebsd/bash/prompt.sh
                      bash -n theme/bash.sh
                      sh -n library/functions.sh
                      sh -n core/environment.sh
                      sh -n target/freebsd/environment.sh
                      sh -n target/freebsd/sh/terminal.sh
                      sh -n target/freebsd/sh/prompt.sh
                      sh -n theme/sh.sh

                      ### --------------------------------
                      ### FREEBSD ZSH INTERACTIVE
                      ### --------------------------------
                      test -f "${HOME}/.zshrc" || { echo "Missing .zshrc"; exit 1; }
                      zsh -i -c 'echo "FreeBSD Zsh prompt: ${PROMPT}"'

                      ### --------------------------------
                      ### FREEBSD BASH INTERACTIVE PTY
                      ### --------------------------------
                      test -f "${HOME}/.bashrc" || { echo "Missing .bashrc"; exit 1; }
                      script -q /dev/null bash -i -c 'echo "FreeBSD Bash prompt: ${PS1}"'

                      ### --------------------------------
                      ### FREEBSD SH INTERACTIVE PTY
                      ### --------------------------------
                      test -f "${HOME}/.shrc" || { echo "Missing .shrc"; exit 1; }
                      ENV="${HOME}/.shrc" script -q /dev/null sh -i -c 'echo "FreeBSD sh prompt: ${PS1}"'

                      ### --------------------------------
                      ### STARTUP LATENCY BENCHMARK
                      ### --------------------------------
                      ./benchmark.sh

    windows:
        name: 🪟 Windows (MSYS2) Matrix
        needs: lint
        runs-on: windows-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Setup MSYS2
              uses: msys2/setup-msys2@v2
              with:
                  msystem: UCRT64
                  update: true
                  install: zsh bash python

            - name: Test in MSYS2 Shell (Zsh & Bash)
              shell: msys2 {0}
              run: |
                  ### ================================
                  ### MSYS2 ENVIRONMENT
                  ### ================================
                  . ./library/detect.sh
                  OS=$(_detect_os)
                  echo "Detected OS: ${OS}"
                  [ "${OS}" = "windows" ] || { echo "Expected windows, got ${OS}"; exit 1; }

                  ### --------------------------------
                  ### RUN UNIVERSAL SHELL INSTALLER
                  ### --------------------------------
                  ./install.sh --pure

                  ### --------------------------------
                  ### WINDOWS TARGET PROMPTS
                  ### --------------------------------
                  zsh -n target/windows/zsh/prompt.sh
                  bash -n target/windows/bash/prompt.sh

                  ### --------------------------------
                  ### MSYS2 ZSH INTERACTIVE
                  ### --------------------------------
                  test -f "${HOME}/.zshrc" || { echo "Missing .zshrc"; exit 1; }
                  zsh -i -c 'echo "Windows MSYS2 Zsh OK: ${PROMPT}"'

                  ### --------------------------------
                  ### MSYS2 BASH INTERACTIVE
                  ### --------------------------------
                  test -f "${HOME}/.bashrc" || { echo "Missing .bashrc"; exit 1; }
                  bash -i -c 'echo "Windows MSYS2 Bash OK: ${PS1}"'

                  ### --------------------------------
                  ### STARTUP LATENCY BENCHMARK
                  ### --------------------------------
                  ./benchmark.sh

    macos:
        name: 🍎 macOS (Darwin) Matrix
        needs: lint
        runs-on: macos-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Install Shell Interpreters
              run: |
                  brew install bash 2> "/dev/null" || true

            - name: Test in macOS Shell (Zsh & Bash)
              run: |
                  ### ================================
                  ### MACOS ENVIRONMENT
                  ### ================================
                  . ./library/detect.sh
                  OS=$(_detect_os)
                  echo "Detected OS: ${OS}"
                  [ "${OS}" = "macos" ] || { echo "Expected macos, got ${OS}"; exit 1; }

                  ### --------------------------------
                  ### RUN UNIVERSAL SHELL INSTALLER
                  ### --------------------------------
                  ./install.sh --pure

                  ### --------------------------------
                  ### MACOS TARGET PROMPTS
                  ### --------------------------------
                  zsh -n target/macos/zsh/prompt.sh
                  bash -n target/macos/bash/prompt.sh

                  ### --------------------------------
                  ### MACOS ZSH INTERACTIVE
                  ### --------------------------------
                  test -f "${HOME}/.zshrc" || { echo "Missing .zshrc"; exit 1; }
                  zsh -i -c 'echo "macOS Zsh prompt OK: ${PROMPT}"'

                  ### --------------------------------
                  ### MACOS BASH INTERACTIVE
                  ### --------------------------------
                  test -f "${HOME}/.bashrc" || { echo "Missing .bashrc"; exit 1; }
                  bash -i -c 'echo "macOS Bash prompt OK: ${PS1}"'

                  ### --------------------------------
                  ### STARTUP LATENCY BENCHMARK
                  ### --------------------------------
                  ./benchmark.sh

    openbsd:
        name: 🐡 OpenBSD (7.x) Matrix
        needs: lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Test in OpenBSD Shell (zsh, bash, ksh)
              uses: vmactions/openbsd-vm@v1
              with:
                  usesh: true
                  envs: "CI GITHUB_ACTIONS"
                  run: |
                      ### ================================
                      ### OPENBSD ENVIRONMENT
                      ### ================================
                      uname -a
                      . ./library/detect.sh
                      OS=$(_detect_os)
                      echo "Detected OS: ${OS}"
                      [ "${OS}" = "openbsd" ] || { echo "Expected openbsd, got ${OS}"; exit 1; }

                      ### --------------------------------
                      ### DEPENDENCIES
                      ### --------------------------------
                      pkg_add -I zsh bash python

                      ### --------------------------------
                      ### RUN UNIVERSAL SHELL INSTALLER
                      ### --------------------------------
                      ./install.sh --pure

                      ### --------------------------------
                      ### OPENBSD TARGET PROMPTS
                      ### --------------------------------
                      zsh -n target/openbsd/zsh/prompt.sh
                      zsh -n theme/zsh.sh
                      bash -n target/openbsd/bash/prompt.sh
                      ksh -n target/openbsd/ksh/prompt.sh
                      ksh -n theme/ksh.sh
                      ksh -n target/common/ksh/ksh.sh
                      sh -n target/openbsd/environment.sh

                      ### --------------------------------
                      ### OPENBSD ZSH INTERACTIVE
                      ### --------------------------------
                      test -f "${HOME}/.zshrc" || { echo "Missing .zshrc"; exit 1; }
                      zsh -i -c 'echo "OpenBSD Zsh prompt: ${PROMPT}"'

                      ### --------------------------------
                      ### OPENBSD BASH INTERACTIVE
                      ### --------------------------------
                      test -f "${HOME}/.bashrc" || { echo "Missing .bashrc"; exit 1; }
                      bash -i -c 'echo "OpenBSD Bash prompt: ${PS1}"'

                      ### --------------------------------
                      ### OPENBSD NATIVE KSH INTERACTIVE
                      ### --------------------------------
                      test -f "${HOME}/.kshrc" || { echo "Missing .kshrc"; exit 1; }
                      ENV="${HOME}/.kshrc" ksh -i -c 'echo "OpenBSD ksh prompt: ${PS1}"'

                      ### --------------------------------
                      ### STARTUP LATENCY BENCHMARK
                      ### --------------------------------
                      ./benchmark.sh -i 3

    netbsd:
        name: 🚩 NetBSD (11.x) Matrix
        needs: lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Test in NetBSD Shell (zsh, bash)
              uses: vmactions/netbsd-vm@v1
              with:
                  usesh: true
                  envs: "CI GITHUB_ACTIONS"
                  run: |
                      ### ================================
                      ### NETBSD ENVIRONMENT
                      ### ================================
                      export PATH="/usr/pkg/bin:/usr/pkg/sbin:/usr/sbin:${PATH}"
                      uname -a
                      . ./library/detect.sh
                      OS=$(_detect_os)
                      echo "Detected OS: ${OS}"
                      [ "${OS}" = "netbsd" ] || { echo "Expected netbsd, got ${OS}"; exit 1; }

                      ### --------------------------------
                      ### DEPENDENCIES
                      ### --------------------------------
                      _pkgs=""
                      command -v zsh > "/dev/null" 2>&1 || _pkgs="${_pkgs} zsh"
                      command -v bash > "/dev/null" 2>&1 || _pkgs="${_pkgs} bash"
                      if ! command -v python3 > "/dev/null" 2>&1 && [ ! -x "/usr/pkg/bin/python3.12" ]; then
                        _pkgs="${_pkgs} python312"
                      fi
                      if [ -n "${_pkgs}" ]; then
                        if command -v pkg_add > "/dev/null" 2>&1; then
                          pkg_add -u ${_pkgs} || pkg_add -I ${_pkgs} || pkg_add ${_pkgs} || true
                        elif command -v pkgin > "/dev/null" 2>&1; then
                          pkgin -y update || true
                          pkgin -y install ${_pkgs}
                        fi
                      fi

                      if [ -x "/usr/pkg/bin/python3.12" ] && [ ! -x "/usr/pkg/bin/python3" ]; then
                        ln -sf /usr/pkg/bin/python3.12 /usr/pkg/bin/python3
                      fi

                      ### --------------------------------
                      ### RUN UNIVERSAL SHELL INSTALLER
                      ### --------------------------------
                      ./install.sh --pure

                      ### --------------------------------
                      ### NETBSD TARGET PROMPTS
                      ### --------------------------------
                      zsh -n target/netbsd/zsh/prompt.sh
                      zsh -n theme/zsh.sh
                      bash -n target/netbsd/bash/prompt.sh
                      sh -n target/netbsd/environment.sh

                      ### --------------------------------
                      ### NETBSD ZSH INTERACTIVE
                      ### --------------------------------
                      test -f "${HOME}/.zshrc" || { echo "Missing .zshrc"; exit 1; }
                      zsh -i -c 'echo "NetBSD Zsh prompt: ${PROMPT}"'

                      ### --------------------------------
                      ### NETBSD BASH INTERACTIVE
                      ### --------------------------------
                      test -f "${HOME}/.bashrc" || { echo "Missing .bashrc"; exit 1; }
                      bash -i -c 'echo "NetBSD Bash prompt: ${PS1}"'

                      ### --------------------------------
                      ### STARTUP LATENCY BENCHMARK
                      ### --------------------------------
                      ./benchmark.sh -i 2

    illumos:
        name: ☀️ illumos (Syntax & Simulation) Matrix
        needs: lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Install Shell Interpreters
              run: |
                  sudo apt-get update
                  sudo apt-get install -y zsh

            - name: Validate illumos Target Syntax
              run: |
                  ### --------------------------------
                  ### ILLUMOS TARGET PROMPTS
                  ### --------------------------------
                  zsh -n target/illumos/zsh/prompt.sh
                  zsh -n theme/zsh.sh
                  bash -n target/illumos/bash/prompt.sh
                  bash -n target/illumos/environment.sh

                  ### --------------------------------
                  ### ILLUMOS MOCK BOOT ZSH
                  ### --------------------------------
                  zsh -c '
                    export SHELL_REPO_DIR="${PWD}"
                    export SHELL_CONTEXT="desktop"
                    export PROMPT_OS_NAME="illumos"
                    . ./library/detect.sh
                    . ./library/functions.sh
                    . ./core/environment.sh
                    . ./target/illumos/environment.sh
                    . ./theme/zsh.sh
                    echo "illumos simulated zsh prompt: ${PROMPT}"
                  '

                  ### --------------------------------
                  ### ILLUMOS MOCK BOOT BASH
                  ### --------------------------------
                  bash -c '
                    export SHELL_REPO_DIR="${PWD}"
                    export SHELL_CONTEXT="desktop"
                    export PROMPT_OS_NAME="illumos"
                    . ./library/detect.sh
                    . ./library/functions.sh
                    . ./core/environment.sh
                    . ./target/illumos/environment.sh
                    . ./theme/bash.sh
                    _update_prompt
                    echo "illumos simulated bash prompt: ${PS1}"
                  '
