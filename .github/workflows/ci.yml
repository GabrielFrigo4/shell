                        . ./target/openbsd/environment.sh
                        . ./theme/bash.sh
                        _update_prompt
                        echo "OpenBSD Bash prompt: ${PS1}"
                      '

                      ### --------------------------------
                      ### OpenBSD Native Ksh
                      ### --------------------------------
                      ksh -c '
                        export SHELL_REPO_DIR="${PWD}"
                        export SHELL_CONTEXT="desktop"
                        . ./library/detect.sh
                        . ./library/functions.sh
                        . ./core/environment.sh
                        . ./target/openbsd/environment.sh
                        . ./theme/ksh.sh
                        echo "OpenBSD ksh prompt: ${PS1}"
                      '

                      ### --------------------------------
                      ### Startup Latency Benchmark (bsh)
                      ### --------------------------------
                      ./scripts/benchmark.sh

    netbsd:
        name: 🚩 NetBSD (10.x) Matrix
        needs: lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Test in NetBSD Shell (zsh, bash)
              uses: vmactions/netbsd-vm@v1
              with:
                  usesh: true
                  run: |
                      ### ================================
                      ### NETBSD ENVIRONMENT
                      ### ================================
                      export PATH="/usr/pkg/bin:/usr/pkg/sbin:/usr/sbin:${PATH}"
                      uname -a
                      . ./library/detect.sh
                      OS=$(_detect_os)
                      echo "Detected OS: ${OS}"
                      [ "${OS}" = "netbsd" ] || { echo "Expected netbsd, got ${OS}"; exit 1; }

                      ### --------------------------------
                      ### Dependencies
                      ### --------------------------------
                      if command -v pkgin > "/dev/null" 2>&1; then
                        pkgin -y update 2> "/dev/null" || true
                        pkgin -y install zsh bash
                      elif command -v pkg_add > "/dev/null" 2>&1; then
                        pkg_add -I zsh bash
                      elif [ -x "/usr/pkg/bin/pkgin" ]; then
                        /usr/pkg/bin/pkgin -y update 2> "/dev/null" || true
                        /usr/pkg/bin/pkgin -y install zsh bash
                      elif [ -x "/usr/pkg/sbin/pkg_add" ]; then
                        /usr/pkg/sbin/pkg_add -I zsh bash
                      elif [ -x "/usr/sbin/pkg_add" ]; then
                        /usr/sbin/pkg_add -I zsh bash
                      fi

                      ### --------------------------------
                      ### NetBSD Target Prompts
                      ### --------------------------------
                      zsh -n target/netbsd/zsh/prompt.sh
                      zsh -n theme/zsh.sh
                      bash -n target/netbsd/bash/prompt.sh
                      sh -n target/netbsd/environment.sh

                      ### --------------------------------
                      ### NetBSD Zsh
                      ### --------------------------------
                      zsh -c '
                        export SHELL_REPO_DIR="${PWD}"
                        export SHELL_CONTEXT="desktop"
                        . ./library/detect.sh
                        . ./library/functions.sh
                        . ./core/environment.sh
                        . ./target/netbsd/environment.sh
                        . ./theme/zsh.sh
                        echo "NetBSD Zsh prompt: ${PROMPT}"
                      '

                      ### --------------------------------
                      ### NetBSD Bash
                      ### --------------------------------
                      bash -c '
                        export SHELL_REPO_DIR="${PWD}"
                        export SHELL_CONTEXT="desktop"
                        . ./library/detect.sh
                        . ./library/functions.sh
                        . ./core/environment.sh
                        . ./target/netbsd/environment.sh
                        . ./theme/bash.sh
                        _update_prompt
                        echo "NetBSD Bash prompt: ${PS1}"
                      '

    illumos:
        name: ☀️ illumos (Syntax & Simulation) Matrix
        needs: lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Install Shell Interpreters
              run: |
                  sudo apt-get update
                  sudo apt-get install -y zsh

            - name: Validate illumos Target Syntax
              run: |
                  ### --------------------------------
                  ### illumos Target Prompts
                  ### --------------------------------
                  zsh -n target/illumos/zsh/prompt.sh
                  zsh -n theme/zsh.sh
                  bash -n target/illumos/bash/prompt.sh
                  bash -n target/illumos/environment.sh

                  ### --------------------------------
                  ### illumos Mock Boot Simulation (Zsh)
                  ### --------------------------------
                  zsh -c '
                    export SHELL_REPO_DIR="${PWD}"
                    export SHELL_CONTEXT="desktop"
                    export PROMPT_OS_NAME="illumos"
                    . ./library/detect.sh
                    . ./library/functions.sh
                    . ./core/environment.sh
                    . ./target/illumos/environment.sh
                    . ./theme/zsh.sh
                    echo "illumos simulated zsh prompt: ${PROMPT}"
                  '

                  ### --------------------------------
                  ### illumos Mock Boot Simulation (Bash)
                  ### --------------------------------
                  bash -c '
                    export SHELL_REPO_DIR="${PWD}"
                    export SHELL_CONTEXT="desktop"
                    export PROMPT_OS_NAME="illumos"
                    . ./library/detect.sh
                    . ./library/functions.sh
                    . ./core/environment.sh
                    . ./target/illumos/environment.sh
                    . ./theme/bash.sh
                    _update_prompt
                    echo "illumos simulated bash prompt: ${PS1}"
                  '
