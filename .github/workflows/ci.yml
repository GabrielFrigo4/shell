                    export SHELL_REPO_DIR="${PWD}"
                    . ./library/detect.sh
                    . ./library/functions.sh
                    . ./core/environment.sh
                    . ./target/windows/environment.sh
                    . ./theme/zsh.sh
                    echo "Windows MSYS2 Zsh OK"
                  '

                  ### --------------------------------
                  ### MSYS2 Bash
                  ### --------------------------------
                  bash -c '
                    export SHELL_REPO_DIR="${PWD}"
                    . ./library/detect.sh
                    . ./library/functions.sh
                    . ./core/environment.sh
                    . ./target/windows/environment.sh
                    . ./theme/bash.sh
                    _update_prompt
                    echo "Windows MSYS2 Bash OK"
                  '

                  ### --------------------------------
                  ### Startup Latency Benchmark (bsh)
                  ### --------------------------------
                  ./scripts/benchmark.sh

