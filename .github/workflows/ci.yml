name: Universal Shell CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    lint:
        name: 🔍 Lint & Syntax Validation
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Install Shell Interpreters
              run: |
                  sudo apt-get update
                  sudo apt-get install -y zsh

            - name: Whitespace & Formatting Check (git diff --check)
              run: |
                  ### --------------------------------
                  ### Whitespace & Formatting
                  ### --------------------------------
                  git diff --check HEAD~1..HEAD 2> "/dev/null" || git diff --check

            - name: Bash Syntax Check (bash -n)
              run: |
                  ### --------------------------------
                  ### Bash & Shared Shell Syntax
                  ### --------------------------------
                  find . -name "*.sh" -not -path "./.git/*" -not -path "*/zsh/*" -not -name "zsh.sh" -exec bash -n {} +

            - name: Zsh Syntax Check (zsh -n)
              run: |
                  ### --------------------------------
                  ### Zsh Syntax
                  ### --------------------------------
                  find . -name "*.sh" -not -path "./.git/*" -not -path "*/bash/*" -not -name "bash.sh" -exec zsh -n {} +

            - name: Quoted Redirects Rule (> "/dev/null")
              run: |
                  ### --------------------------------
                  ### Quoting & Security Rules
                  ### --------------------------------
                  UNQUOTED=$(grep -rn '> /dev/null' --include="*.sh" . | grep -v '> "/dev/null"' || true)
                  if [ -n "${UNQUOTED}" ]; then
                    echo "❌ Unquoted redirect '> /dev/null' found in:"
                    echo "${UNQUOTED}"
                    exit 1
                  fi
                  echo "✅ All redirects are properly quoted."

    linux:
        name: 🐧 Linux (Ubuntu) Matrix
        needs: lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Install Shell Interpreters
              run: |
                  sudo apt-get update
                  sudo apt-get install -y zsh

            - name: Install Shell Environment (install.sh)
              run: |
                  ### --------------------------------
                  ### Run Universal Shell Installer
                  ### --------------------------------
                  ./install.sh --pure

            - name: Test in Linux Shell (Zsh & Bash)
              run: |
                  ### ================================
                  ### LINUX ENVIRONMENT
                  ### ================================
                  . ./library/detect.sh
                  OS=$(_detect_os)
                  echo "Detected OS: ${OS}"
                  [ "${OS}" = "linux" ] || { echo "Expected linux, got ${OS}"; exit 1; }

                  ### --------------------------------
                  ### Linux Target Prompts
                  ### --------------------------------
                  zsh -n target/linux/zsh/prompt.sh
                  bash -n target/linux/bash/prompt.sh

                  ### --------------------------------
                  ### Linux Zsh Interactive Boot
                  ### --------------------------------
                  test -f "${HOME}/.zshrc" || { echo "Missing .zshrc"; exit 1; }
                  zsh -i -c 'echo "Linux Zsh boot with dotfiles OK: ${PROMPT}"'

                  ### --------------------------------
                  ### Linux Bash Interactive Boot
                  ### --------------------------------
                  test -f "${HOME}/.bashrc" || { echo "Missing .bashrc"; exit 1; }
                  bash -i -c 'echo "Linux Bash boot with dotfiles OK: ${PS1}"'

                  ### --------------------------------
                  ### Startup Latency Benchmark (bsh)
                  ### --------------------------------
                  ./benchmark.sh

    freebsd:
        name: 😈 FreeBSD (15.x) Matrix
        needs: lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Test in FreeBSD Shell (zsh, bash, sh)
              uses: vmactions/freebsd-vm@v1
              with:
                  release: "15"
                  usesh: true
                  envs: "CI GITHUB_ACTIONS"
                  run: |
                      ### ================================
                      ### FREEBSD ENVIRONMENT
                      ### ================================
                      freebsd-version || uname -a
                      . ./library/detect.sh
                      OS=$(_detect_os)
                      echo "Detected OS: ${OS}"
                      [ "${OS}" = "freebsd" ] || { echo "Expected freebsd, got ${OS}"; exit 1; }

                      ### --------------------------------
                      ### Dependencies
                      ### --------------------------------
                      pkg install -y zsh bash python3

                      ### --------------------------------
                      ### Run Universal Shell Installer
                      ### --------------------------------
                      ./install.sh --pure

                      ### --------------------------------
                      ### FreeBSD Target Prompts
                      ### --------------------------------
                      zsh -n target/freebsd/zsh/prompt.sh
                      zsh -n theme/zsh.sh
                      bash -n target/freebsd/bash/prompt.sh
                      bash -n theme/bash.sh
                      sh -n library/functions.sh
                      sh -n core/environment.sh
                      sh -n target/freebsd/environment.sh
                      sh -n target/freebsd/sh/terminal.sh
                      sh -n target/freebsd/sh/prompt.sh
                      sh -n theme/sh.sh

                      ### --------------------------------
                      ### FreeBSD Zsh Interactive
                      ### --------------------------------
                      test -f "${HOME}/.zshrc" || { echo "Missing .zshrc"; exit 1; }
                      zsh -i -c 'echo "FreeBSD Zsh prompt: ${PROMPT}"'

                      ### --------------------------------
                      ### FreeBSD Bash Interactive PTY
                      ### --------------------------------
                      test -f "${HOME}/.bashrc" || { echo "Missing .bashrc"; exit 1; }
                      script -q /dev/null bash -i -c 'echo "FreeBSD Bash prompt: ${PS1}"'

                      ### --------------------------------
                      ### FreeBSD /bin/sh Interactive PTY
                      ### --------------------------------
                      test -f "${HOME}/.shrc" || { echo "Missing .shrc"; exit 1; }
                      ENV="${HOME}/.shrc" script -q /dev/null sh -i -c 'echo "FreeBSD /bin/sh prompt: ${PS1}"'

                      ### --------------------------------
                      ### Startup Latency Benchmark (bsh)
                      ### --------------------------------
                      ./benchmark.sh

    windows:
        name: 🪟 Windows (MSYS2) Matrix
        needs: lint
        runs-on: windows-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Setup MSYS2
              uses: msys2/setup-msys2@v2
              with:
                  msystem: UCRT64
                  update: true
                  install: zsh bash python

            - name: Test in MSYS2 Shell (Zsh & Bash)
              shell: msys2 {0}
              run: |
                  ### ================================
                  ### MSYS2 ENVIRONMENT
                  ### ================================
                  . ./library/detect.sh
                  OS=$(_detect_os)
                  echo "Detected OS: ${OS}"
                  [ "${OS}" = "windows" ] || { echo "Expected windows, got ${OS}"; exit 1; }

                  ### --------------------------------
                  ### Run Universal Shell Installer
                  ### --------------------------------
                  ./install.sh --pure

                  ### --------------------------------
                  ### Windows Target Prompts
                  ### --------------------------------
                  zsh -n target/windows/zsh/prompt.sh
                  bash -n target/windows/bash/prompt.sh

                  ### --------------------------------
                  ### MSYS2 Zsh Interactive
                  ### --------------------------------
                  test -f "${HOME}/.zshrc" || { echo "Missing .zshrc"; exit 1; }
                  zsh -i -c 'echo "Windows MSYS2 Zsh OK: ${PROMPT}"'

                  ### --------------------------------
                  ### MSYS2 Bash Interactive
                  ### --------------------------------
                  test -f "${HOME}/.bashrc" || { echo "Missing .bashrc"; exit 1; }
                  bash -i -c 'echo "Windows MSYS2 Bash OK: ${PS1}"'

                  ### --------------------------------
                  ### Startup Latency Benchmark (bsh)
                  ### --------------------------------
                  ./benchmark.sh

    macos:
        name: 🍎 macOS (Darwin) Matrix
        needs: lint
        runs-on: macos-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Install Shell Interpreters
              run: |
                  brew install bash 2> "/dev/null" || true

            - name: Test in macOS Shell (Zsh & Bash)
              run: |
                  ### ================================
                  ### MACOS ENVIRONMENT
                  ### ================================
                  . ./library/detect.sh
                  OS=$(_detect_os)
                  echo "Detected OS: ${OS}"
                  [ "${OS}" = "macos" ] || { echo "Expected macos, got ${OS}"; exit 1; }

                  ### --------------------------------
                  ### Run Universal Shell Installer
                  ### --------------------------------
                  ./install.sh --pure

                  ### --------------------------------
                  ### macOS Target Prompts
                  ### --------------------------------
                  zsh -n target/macos/zsh/prompt.sh
                  bash -n target/macos/bash/prompt.sh

                  ### --------------------------------
                  ### macOS Zsh Interactive
                  ### --------------------------------
                  test -f "${HOME}/.zshrc" || { echo "Missing .zshrc"; exit 1; }
                  zsh -i -c 'echo "macOS Zsh prompt OK: ${PROMPT}"'

                  ### --------------------------------
                  ### macOS Bash Interactive
                  ### --------------------------------
                  test -f "${HOME}/.bashrc" || { echo "Missing .bashrc"; exit 1; }
                  bash -i -c 'echo "macOS Bash prompt OK: ${PS1}"'

                  ### --------------------------------
                  ### Startup Latency Benchmark (bsh)
                  ### --------------------------------
                  ./benchmark.sh

    openbsd:
        name: 🐡 OpenBSD (7.x) Matrix
        needs: lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Test in OpenBSD Shell (zsh, bash, ksh)
              uses: vmactions/openbsd-vm@v1
              with:
                  usesh: true
                  envs: "CI GITHUB_ACTIONS"
                  run: |
                      ### ================================
                      ### OPENBSD ENVIRONMENT
                      ### ================================
                      uname -a
                      . ./library/detect.sh
                      OS=$(_detect_os)
                      echo "Detected OS: ${OS}"
                      [ "${OS}" = "openbsd" ] || { echo "Expected openbsd, got ${OS}"; exit 1; }

                      ### --------------------------------
                      ### Dependencies
                      ### --------------------------------
                      pkg_add -I zsh bash python

                      ### --------------------------------
                      ### Run Universal Shell Installer
                      ### --------------------------------
                      ./install.sh --pure

                      ### --------------------------------
                      ### OpenBSD Target Prompts
                      ### --------------------------------
                      zsh -n target/openbsd/zsh/prompt.sh
                      zsh -n theme/zsh.sh
                      bash -n target/openbsd/bash/prompt.sh
                      ksh -n target/openbsd/ksh/prompt.sh
                      ksh -n theme/ksh.sh
                      ksh -n target/common/ksh.sh
                      sh -n target/openbsd/environment.sh

                      ### --------------------------------
                      ### OpenBSD Zsh Interactive
                      ### --------------------------------
                      test -f "${HOME}/.zshrc" || { echo "Missing .zshrc"; exit 1; }
                      zsh -i -c 'echo "OpenBSD Zsh prompt: ${PROMPT}"'

                      ### --------------------------------
                      ### OpenBSD Bash Interactive
                      ### --------------------------------
                      test -f "${HOME}/.bashrc" || { echo "Missing .bashrc"; exit 1; }
                      bash -i -c 'echo "OpenBSD Bash prompt: ${PS1}"'

                      ### --------------------------------
                      ### OpenBSD Native Ksh Interactive
                      ### --------------------------------
                      test -f "${HOME}/.kshrc" || { echo "Missing .kshrc"; exit 1; }
                      ENV="${HOME}/.kshrc" ksh -i -c 'echo "OpenBSD ksh prompt: ${PS1}"'

                      ### --------------------------------
                      ### Startup Latency Benchmark (bsh)
                      ### --------------------------------
                      ./benchmark.sh

    netbsd:
        name: 🚩 NetBSD (11.x) Matrix
        needs: lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Test in NetBSD Shell (zsh, bash)
              uses: vmactions/netbsd-vm@v1
              with:
                  usesh: true
                  envs: "CI GITHUB_ACTIONS"
                  run: |
                      ### ================================
                      ### NETBSD ENVIRONMENT
                      ### ================================
                      export PATH="/usr/pkg/bin:/usr/pkg/sbin:/usr/sbin:${PATH}"
                      uname -a
                      . ./library/detect.sh
                      OS=$(_detect_os)
                      echo "Detected OS: ${OS}"
                      [ "${OS}" = "netbsd" ] || { echo "Expected netbsd, got ${OS}"; exit 1; }

                      ### --------------------------------
                      ### Dependencies
                      ### --------------------------------
                      if command -v pkg_add > "/dev/null" 2>&1; then
                        pkg_add -I zsh bash python312
                      elif command -v pkgin > "/dev/null" 2>&1; then
                        pkgin -y update || true
                        pkgin -y install zsh bash python312
                      fi

                      if [ -x "/usr/pkg/bin/python3.12" ] && [ ! -x "/usr/pkg/bin/python3" ]; then
                        ln -sf /usr/pkg/bin/python3.12 /usr/pkg/bin/python3
                      fi

                      ### --------------------------------
                      ### Run Universal Shell Installer
                      ### --------------------------------
                      ./install.sh --pure

                      ### --------------------------------
                      ### NetBSD Target Prompts
                      ### --------------------------------
                      zsh -n target/netbsd/zsh/prompt.sh
                      zsh -n theme/zsh.sh
                      bash -n target/netbsd/bash/prompt.sh
                      sh -n target/netbsd/environment.sh

                      ### --------------------------------
                      ### NetBSD Zsh Interactive
                      ### --------------------------------
                      test -f "${HOME}/.zshrc" || { echo "Missing .zshrc"; exit 1; }
                      zsh -i -c 'echo "NetBSD Zsh prompt: ${PROMPT}"'

                      ### --------------------------------
                      ### NetBSD Bash Interactive
                      ### --------------------------------
                      test -f "${HOME}/.bashrc" || { echo "Missing .bashrc"; exit 1; }
                      bash -i -c 'echo "NetBSD Bash prompt: ${PS1}"'

                      ### --------------------------------
                      ### Startup Latency Benchmark (bsh)
                      ### --------------------------------
                      ./benchmark.sh -i 2

    illumos:
        name: ☀️ illumos (Syntax & Simulation) Matrix
        needs: lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Install Shell Interpreters
              run: |
                  sudo apt-get update
                  sudo apt-get install -y zsh

            - name: Validate illumos Target Syntax
              run: |
                  ### --------------------------------
                  ### illumos Target Prompts
                  ### --------------------------------
                  zsh -n target/illumos/zsh/prompt.sh
                  zsh -n theme/zsh.sh
                  bash -n target/illumos/bash/prompt.sh
                  bash -n target/illumos/environment.sh

                  ### --------------------------------
                  ### illumos Mock Boot (Zsh)
                  ### --------------------------------
                  zsh -c '
                    export SHELL_REPO_DIR="${PWD}"
                    export SHELL_CONTEXT="desktop"
                    export PROMPT_OS_NAME="illumos"
                    . ./library/detect.sh
                    . ./library/functions.sh
                    . ./core/environment.sh
                    . ./target/illumos/environment.sh
                    . ./theme/zsh.sh
                    echo "illumos simulated zsh prompt: ${PROMPT}"
                  '

                  ### --------------------------------
                  ### illumos Mock Boot (Bash)
                  ### --------------------------------
                  bash -c '
                    export SHELL_REPO_DIR="${PWD}"
                    export SHELL_CONTEXT="desktop"
                    export PROMPT_OS_NAME="illumos"
                    . ./library/detect.sh
                    . ./library/functions.sh
                    . ./core/environment.sh
                    . ./target/illumos/environment.sh
                    . ./theme/bash.sh
                    _update_prompt
                    echo "illumos simulated bash prompt: ${PS1}"
                  '
